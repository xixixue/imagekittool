<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#c9f7e8"/><stop offset=".52" stop-color="#ffe0ad"/><stop offset="1" stop-color="#e1d3ff"/></linearGradient></defs><rect width="1200" height="675" rx="36" fill="url(#bg)"/><text x="600" y="72" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700" fill="#22223b">Three ways to obscure image details</text><g><rect x="65" y="135" width="330" height="380" rx="26" fill="white"/><circle cx="230" cy="275" r="84" fill="#ffd39a"/><circle cx="202" cy="257" r="10" fill="#34345e"/><circle cx="258" cy="257" r="10" fill="#34345e"/><path d="M198 310q32 25 64 0" stroke="#34345e" stroke-width="8" fill="none" stroke-linecap="round"/><rect x="160" y="225" width="140" height="110" rx="16" fill="#8b75e8" opacity=".62"/><text x="230" y="405" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#34345e">Blur</text><text x="230" y="448" text-anchor="middle" font-family="Arial" font-size="19" fill="#6b6682">Softens details</text><text x="230" y="480" text-anchor="middle" font-family="Arial" font-size="17" fill="#c44b51">Not secure redaction</text></g><g><rect x="435" y="135" width="330" height="380" rx="26" fill="white"/><circle cx="600" cy="275" r="84" fill="#ffd39a"/><g fill="#a58ae9"><rect x="530" y="205" width="35" height="35"/><rect x="565" y="205" width="35" height="35"/><rect x="600" y="205" width="35" height="35"/><rect x="635" y="205" width="35" height="35"/><rect x="530" y="240" width="35" height="35"/><rect x="565" y="240" width="35" height="35"/><rect x="600" y="240" width="35" height="35"/><rect x="635" y="240" width="35" height="35"/><rect x="530" y="275" width="35" height="35"/><rect x="565" y="275" width="35" height="35"/><rect x="600" y="275" width="35" height="35"/><rect x="635" y="275" width="35" height="35"/><rect x="530" y="310" width="35" height="35"/><rect x="565" y="310" width="35" height="35"/><rect x="600" y="310" width="35" height="35"/><rect x="635" y="310" width="35" height="35"/></g><text x="600" y="405" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#34345e">Pixelate</text><text x="600" y="448" text-anchor="middle" font-family="Arial" font-size="19" fill="#6b6682">Groups pixels into blocks</text><text x="600" y="480" text-anchor="middle" font-family="Arial" font-size="17" fill="#c44b51">Still may reveal clues</text></g><g><rect x="805" y="135" width="330" height="380" rx="26" fill="white"/><circle cx="970" cy="275" r="84" fill="#ffd39a"/><circle cx="942" cy="257" r="10" fill="#34345e"/><circle cx="998" cy="257" r="10" fill="#34345e"/><path d="M938 310q32 25 64 0" stroke="#34345e" stroke-width="8" fill="none" stroke-linecap="round"/><rect x="895" y="220" width="150" height="110" rx="12" fill="#29264b"/><text x="970" y="405" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#34345e">Solid cover</text><text x="970" y="448" text-anchor="middle" font-family="Arial" font-size="19" fill="#6b6682">Opaque, flattened fill</text><text x="970" y="480" text-anchor="middle" font-family="Arial" font-size="17" fill="#16845f">Best choice for sensitive data</text></g><text x="600" y="585" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#34345e">For passwords, IDs, and addresses: cover completely, flatten, then inspect</text></svg>
