<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#55b9e8"/><stop offset="1" stop-color="#b7e8f5"/></linearGradient></defs><rect width="1200" height="675" rx="32" fill="#fff1d4"/><text x="600" y="68" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700" fill="#202047">What lossy compression artifacts look like</text><g><rect x="65" y="120" width="330" height="420" rx="24" fill="white"/><rect x="95" y="155" width="270" height="235" rx="14" fill="url(#sky)"/><circle cx="285" cy="215" r="36" fill="#ffda66"/><path d="M95 365l95-120 55 70 42-50 78 100z" fill="#2d9b85"/><path d="M95 355l85-60 55 35 42-38 88 63v35H95z" fill="#236f6a"/><text x="230" y="445" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#34345e">Clean source</text><text x="230" y="485" text-anchor="middle" font-family="Arial" font-size="19" fill="#686481">Edges and gradients stay smooth</text></g><g><rect x="435" y="120" width="330" height="420" rx="24" fill="white"/><rect x="465" y="155" width="270" height="235" rx="14" fill="url(#sky)"/><circle cx="655" cy="215" r="36" fill="#ffda66"/><path d="M465 365l95-120 55 70 42-50 78 100z" fill="#2d9b85"/><path d="M465 355l85-60 55 35 42-38 88 63v35H465z" fill="#236f6a"/><g stroke="#6c4ce5" stroke-width="2" opacity=".65"><path d="M510 155v235M555 155v235M600 155v235M645 155v235M690 155v235M465 202h270M465 249h270M465 296h270M465 343h270"/></g><text x="600" y="445" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#34345e">Blocking</text><text x="600" y="485" text-anchor="middle" font-family="Arial" font-size="19" fill="#686481">Square boundaries appear in flat areas</text></g><g><rect x="805" y="120" width="330" height="420" rx="24" fill="white"/><rect x="835" y="155" width="270" height="235" rx="14" fill="url(#sky)"/><circle cx="1025" cy="215" r="36" fill="#ffda66"/><path d="M835 365l95-120 55 70 42-50 78 100z" fill="#2d9b85"/><path d="M835 355l85-60 55 35 42-38 88 63v35H835z" fill="#236f6a"/><path d="M830 285h280" stroke="#f45b69" stroke-width="13" opacity=".7"/><path d="M830 300h280" stroke="#f45b69" stroke-width="6" opacity=".45"/><text x="970" y="445" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#34345e">Ringing / halos</text><text x="970" y="485" text-anchor="middle" font-family="Arial" font-size="19" fill="#686481">Bright or dark fringes form near edges</text></g><text x="600" y="610" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#34345e">Compare the export at 100% and at its actual display size</text></svg>
