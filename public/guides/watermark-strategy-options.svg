<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#d1f5ed"/><stop offset="1" stop-color="#ffe1b7"/></linearGradient></defs><rect width="1200" height="675" rx="36" fill="url(#bg)"/><text x="600" y="76" text-anchor="middle" font-family="Arial" font-size="43" font-weight="700" fill="#22223b">Visible watermark placement</text><g><rect x="90" y="145" width="450" height="340" rx="24" fill="white"/><rect x="125" y="180" width="380" height="245" rx="16" fill="#49b7d3"/><circle cx="315" cy="280" r="70" fill="#ffd36e"/><path d="M125 400l110-105 75 62 70-82 125 125" fill="#318e7e"/><rect x="385" y="375" width="95" height="30" rx="8" fill="#29264b" opacity=".8"/><text x="432" y="397" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="white">MY BRAND</text><text x="315" y="462" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#34345e">Single mark</text><text x="315" y="520" text-anchor="middle" font-family="Arial" font-size="20" fill="#615c7c">Subtle, but easy to crop</text></g><g><rect x="660" y="145" width="450" height="340" rx="24" fill="white"/><rect x="695" y="180" width="380" height="245" rx="16" fill="#49b7d3"/><circle cx="885" cy="280" r="70" fill="#ffd36e"/><path d="M695 400l110-105 75 62 70-82 125 125" fill="#318e7e"/><g transform="rotate(-25 885 300)" font-family="Arial" font-size="25" font-weight="700" fill="white" opacity=".72"><text x="700" y="245">MY BRAND</text><text x="860" y="245">MY BRAND</text><text x="700" y="315">MY BRAND</text><text x="860" y="315">MY BRAND</text><text x="700" y="385">MY BRAND</text><text x="860" y="385">MY BRAND</text></g><text x="885" y="462" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#34345e">Tiled marks</text><text x="885" y="520" text-anchor="middle" font-family="Arial" font-size="20" fill="#615c7c">More coverage, more visual impact</text></g><rect x="245" y="585" width="710" height="54" rx="27" fill="#29264b"/><text x="600" y="620" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="white">Watermarks deter casual reuse — they do not guarantee protection</text></svg>
